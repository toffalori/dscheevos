name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # the version is in both user agents RetroAchievements sees, so a release tag must match it
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)" || { echo "tag $GITHUB_REF_NAME but VERSION is $(cat VERSION)"; exit 1; }
      - name: nds-bootstrap (DScheevos branch)
        run: |
          gcc -O2 -static external/nds-bootstrap/lzss.c -o "$RUNNER_TEMP/lzss"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/lzss:/usr/local/bin/lzss:ro" -w /src/external/nds-bootstrap \
            devkitpro/devkitarm:20241104 bash -c 'git config --global safe.directory "*" && make package-nightly'
      - name: Pop-up font (python3 on the runner; the devkitARM image has none)
        run: |
          mkdir -p dscheevos/module/gen
          python3 dscheevos/display/tools/fontgen.py external/nds-bootstrap extended_latin dsd_font_latin dscheevos/module/gen/font_latin.c
      - name: Module
        run: docker run --rm -v "$PWD:/src" -w /src devkitpro/devkitarm:20241104 make -C dscheevos/module
      - name: Loader (nds-bootloader)
        run: docker run --rm -v "$PWD:/src" -w /src devkitpro/devkitarm:20260610 make -C dscheevos/launcher/loader
      - name: Launcher
        run: docker run --rm -v "$PWD:/src" -w /src skylyrac/blocksds:slim-v1.24.0 make -C dscheevos/launcher
      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) version="$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)";; esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          release/package.sh "$PWD/out/dscheevos" "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: dscheevos-${{ env.VERSION }}
          path: out/dscheevos-*.zip
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/dscheevos-*.zip --prerelease --title "DScheevos $GITHUB_REF_NAME" --notes-file release/README.txt
